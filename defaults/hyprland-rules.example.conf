# Optional Hyprland rules & keybindings for Game Dev Hub
# Verify syntax against your installed Hyprland version (`hyprctl version`).
#
# Note: Game Dev Hub automatically floats & centers Godot staging preview windows
# by PID via Hyprland's .socket.sock when running under Hyprland.
# These rules are optional helpers for global capture & editor focus.

# Example: Global hotkey to capture the active Game Dev Hub preview into chat
bind = SUPER SHIFT, P, exec, game-hub --capture-preview

# Example: Window rules for Godot staging preview (if not handled dynamically)
# Hyprland >= 0.45 syntax:
# windowrulev2 = float, class:^(Godot)$, title:^(.*DEBUG.*)$
# windowrulev2 = center, class:^(Godot)$, title:^(.*DEBUG.*)$
# windowrulev2 = size 1280 720, class:^(Godot)$, title:^(.*DEBUG.*)$
